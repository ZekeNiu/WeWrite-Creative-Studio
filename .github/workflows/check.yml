name: Windows acceptance
on:
  push:
    branches: [main, 'codex/*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-lock.txt
      - run: npm ci
      - run: python -m pytest -q --disable-warnings -o faulthandler_timeout=60 --durations=5
      - run: npm run build
      - name: Verify shipped interface
        run: git diff --exit-code -- dist
      - name: Offline browser acceptance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/diagnostics | Out-Null
          $qa = Start-Process -FilePath python -ArgumentList 'tools/qa_reliability_app.py' -PassThru -WindowStyle Hidden -RedirectStandardOutput output/diagnostics/qa-server.txt -RedirectStandardError output/diagnostics/qa-server-error.txt
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try { Invoke-RestMethod http://127.0.0.1:8977/api/health | Out-Null; $ready = $true; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'QA server did not start' }
            python tools/check_reliability_ui.py
            if ($LASTEXITCODE -ne 0) { throw 'Browser acceptance failed' }
            python tools/check_research_convergence_ui.py
            if ($LASTEXITCODE -ne 0) { throw 'Research convergence acceptance failed' }
            python tools/check_ui_reliability_v230.py
            if ($LASTEXITCODE -ne 0) { throw 'UI reliability acceptance failed' }
            python tools/check_ui_visual_v231.py
            if ($LASTEXITCODE -ne 0) { throw 'Original home and visual acceptance failed' }
            python tools/check_model_stability_ui.py
            if ($LASTEXITCODE -ne 0) { throw 'Model settings and diagnostics acceptance failed' }
          } finally {
            if (-not $qa.HasExited) { Stop-Process -Id $qa.Id }
          }
      - name: Reader workflow browser acceptance
        shell: pwsh
        run: |
          $qaReader = Start-Process -FilePath python -ArgumentList '-m','tools.qa_reader_app' -PassThru -WindowStyle Hidden -RedirectStandardOutput output/diagnostics/qa-reader.txt -RedirectStandardError output/diagnostics/qa-reader-error.txt
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try { Invoke-RestMethod http://127.0.0.1:8978/api/health | Out-Null; $ready = $true; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Reader QA server did not start' }
            python -m tools.check_reader_ui
            if ($LASTEXITCODE -ne 0) { throw 'Reader workflow acceptance failed' }
          } finally {
            if (-not $qaReader.HasExited) { Stop-Process -Id $qaReader.Id }
          }
      - name: Preserve synthetic browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-browser-diagnostics
          path: |
            output/playwright/reliability/
            output/playwright/v231/
            output/playwright/v232/
            output/playwright/v237/
            output/playwright/reader-workflow/
            output/diagnostics/qa-reader*.txt
            output/diagnostics/qa-server*.txt
          if-no-files-found: ignore
